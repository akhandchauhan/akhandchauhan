<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Akhand Chauhan, Data Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="0.62" stop-color="#070b26"/>
      <stop offset="1" stop-color="#12052a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect x="0" y="270" width="1200" height="110" fill="url(#gridFade)"/></mask>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
    <clipPath id="t1"><rect x="330" y="198" height="30" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;540;540;0;0" keyTimes="0;0.12;0.30;0.33;1"/></rect></clipPath>
    <clipPath id="t2"><rect x="330" y="198" height="30" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;540;540;0;0" keyTimes="0;0.33;0.45;0.63;0.66;1"/></rect></clipPath>
    <clipPath id="t3"><rect x="330" y="198" height="30" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;540;540;0;0" keyTimes="0;0.66;0.78;0.96;0.99;1"/></rect></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>

    <g fill="#9fe9ff">
      <circle cx="90" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="140" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="40" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="62" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="160" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="55" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="225" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="230" r="1"><animate attributeName="opacity" values="1;0.4;1" dur="3.9s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="0" y="270" width="1200" height="110" fill="url(#horizonGlow)"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#ff2bd6" stroke-width="1.5" filter="url(#softGlow)" opacity="0.9"/>

    <g mask="url(#gridMask)" stroke="#8a5cff" stroke-width="1.2" opacity="0.85">
      <line x1="600" y1="270" x2="600" y2="380"/>
      <line x1="612" y1="270" x2="760" y2="380"/><line x1="588" y1="270" x2="440" y2="380"/>
      <line x1="624" y1="270" x2="920" y2="380"/><line x1="576" y1="270" x2="280" y2="380"/>
      <line x1="636" y1="270" x2="1080" y2="380"/><line x1="564" y1="270" x2="120" y2="380"/>
      <line x1="648" y1="270" x2="1240" y2="380"/><line x1="552" y1="270" x2="-40" y2="380"/>
      <line x1="660" y1="270" x2="1400" y2="380"/><line x1="540" y1="270" x2="-200" y2="380"/>
      <line x1="672" y1="270" x2="1560" y2="380"/><line x1="528" y1="270" x2="-360" y2="380"/>
      <line x1="0" x2="1200" y1="270" y2="270"><animate attributeName="y1" values="270;380" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="270;380" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="270" y2="270"><animate attributeName="y1" values="270;380" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="270;380" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="270" y2="270"><animate attributeName="y1" values="270;380" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="270;380" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="270" y2="270"><animate attributeName="y1" values="270;380" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="270;380" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="270" y2="270"><animate attributeName="y1" values="270;380" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="270;380" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="270" y2="270"><animate attributeName="y1" values="270;380" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="270;380" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.55 0 1 1"/></line>
    </g>

    <g fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8">
      <path d="M24 56 V24 H56"/><path d="M1144 24 H1176 V56"/>
      <path d="M24 324 V356 H56"/><path d="M1176 324 V356 H1144"/>
    </g>
    <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="12" letter-spacing="2" fill="#5fd8ff" opacity="0.85">
      <text x="68" y="40">SYS://AKHAND_CHAUHAN ▸ PROFILE</text>
      <text x="1132" y="40" text-anchor="end" fill="#39ff9c">ONLINE</text>
      <text x="68" y="350">INGEST → TRANSFORM → SERVE</text>
      <text x="1132" y="350" text-anchor="end">BUILD 2026.11</text>
    </g>
    <circle cx="1060" cy="36" r="4" fill="#39ff9c" filter="url(#softGlow)"><animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/></circle>

    <!-- name with glitch split -->
    <g font-family="Bahnschrift, 'DIN Alternate', 'Arial Narrow', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="84" text-anchor="middle">
      <text x="600" y="128" fill="#ff2bd6" opacity="0.7" textLength="760" lengthAdjust="spacingAndGlyphs">AKHAND CHAUHAN
        <animate attributeName="x" values="600;600;607;595;600;600" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></text>
      <text x="600" y="128" fill="#00f0ff" opacity="0.7" textLength="760" lengthAdjust="spacingAndGlyphs">AKHAND CHAUHAN
        <animate attributeName="x" values="600;600;593;605;600;600" keyTimes="0;0.9;0.92;0.94;0.96;1" dur="6s" repeatCount="indefinite" calcMode="discrete"/></text>
      <text x="600" y="128" fill="url(#title)" filter="url(#glow)" textLength="760" lengthAdjust="spacingAndGlyphs">AKHAND CHAUHAN</text>
    </g>
    <text x="600" y="168" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="18" letter-spacing="7" fill="#ff5fe0" filter="url(#softGlow)">DATA ENGINEER // PIPELINES THAT SCALE</text>

    <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="19" fill="#c9f6ff" filter="url(#softGlow)">
      <text x="300" y="219" fill="#ff2bd6">&gt;</text>
      <text x="330" y="219" clip-path="url(#t1)" textLength="540" lengthAdjust="spacingAndGlyphs">building data pipelines that run on schedule</text>
      <text x="330" y="219" clip-path="url(#t2)" textLength="540" lengthAdjust="spacingAndGlyphs">python · sql · pyspark · airflow · gcp · docker</text>
      <text x="330" y="219" clip-path="url(#t3)" textLength="540" lengthAdjust="spacingAndGlyphs">etl · data modeling · orchestration · dbt</text>
      <rect y="203" width="11" height="20" fill="#00f0ff">
        <animate attributeName="x" dur="12s" repeatCount="indefinite" values="332;874;874;332;332;874;874;332;332;874;874;332" keyTimes="0;0.12;0.30;0.33;0.33;0.45;0.63;0.66;0.66;0.78;0.96;1"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" calcMode="discrete"/>
      </rect>
    </g>

    <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="12" letter-spacing="2" text-anchor="middle">
      <rect x="346" y="240" width="110" height="22" rx="4" fill="#ff2bd6" fill-opacity="0.08" stroke="#ff2bd6" stroke-opacity="0.6"/>
      <text x="401" y="255" fill="#ff8ae8">PYSPARK</text>
      <rect x="470" y="240" width="110" height="22" rx="4" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.6"/>
      <text x="525" y="255" fill="#7ff6ff">AIRFLOW</text>
      <rect x="594" y="240" width="80" height="22" rx="4" fill="#8a5cff" fill-opacity="0.1" stroke="#8a5cff" stroke-opacity="0.7"/>
      <text x="634" y="255" fill="#c4a8ff">GCP</text>
      <rect x="688" y="240" width="80" height="22" rx="4" fill="#ffb800" fill-opacity="0.08" stroke="#ffb800" stroke-opacity="0.6"/>
      <text x="728" y="255" fill="#ffcf4d">DBT</text>
      <rect x="782" y="240" width="80" height="22" rx="4" fill="#39ff9c" fill-opacity="0.08" stroke="#39ff9c" stroke-opacity="0.6"/>
      <text x="822" y="255" fill="#8affc4">SQL</text>
    </g>

    <rect x="0" y="-8" width="1200" height="6" fill="#00f0ff" opacity="0.07">
      <animate attributeName="y" values="-8;388" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="380" rx="18" fill="none" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="2"/>
  </g>
</svg>
